name: Check free models
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Exit code 1 (job fails, GitHub emails the owner) when a preset model is no longer listed or no longer free.
      # Gemini and Mistral are checked only if repository secrets GEMINI_API_KEY / MISTRAL_API_KEY exist.
      - run: pnpm check:models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
